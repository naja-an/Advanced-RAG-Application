<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG API Upload Test</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2f6; color: #17202a; }
    main { width: min(92vw, 620px); padding: 32px; background: white; border: 1px solid #d8e0e8; border-radius: 12px; box-shadow: 0 12px 30px #17202a14; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #52606d; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 22px; }
    button { border: 0; border-radius: 7px; padding: 10px 16px; background: #1769aa; color: white; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input[type=file], input[type=url] { max-width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #c8d2dc; border-radius: 7px; font: inherit; }
    textarea { width: 100%; min-height: 90px; box-sizing: border-box; padding: 10px; border: 1px solid #c8d2dc; border-radius: 7px; resize: vertical; font: inherit; }
    #selected-files { width: 100%; color: #52606d; font-size: .9rem; }
    #selected-files p { margin: 0; }
    .selected-file-list { display: grid; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
    .selected-file-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; overflow-wrap: anywhere; }
    .remove-file { flex: none; padding: 6px 10px; background: #8b2e2e; }
    #session { font-family: ui-monospace, monospace; font-size: .84rem; word-break: break-all; }
    #status { margin-top: 22px; padding: 12px; border-radius: 7px; background: #f3f6f8; white-space: pre-wrap; }
    .source-disclosure summary { cursor: pointer; font-weight: 650; }
    .source-list { display: grid; gap: 0; margin: 12px 0 0; padding-left: 24px; }
    .source-list li { padding: 12px 4px; border-top: 1px solid #c6d8cc; }
    .source-heading { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
    .source-list p { margin: 6px 0 0; color: inherit; font-size: .9rem; line-height: 1.5; white-space: normal; }
    #conversation { display: grid; gap: 16px; margin-top: 18px; }
    .turn { display: grid; gap: 10px; }
    .message { max-width: 90%; padding: 12px; border: 1px solid #d8e0e8; border-radius: 7px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { justify-self: end; background: #eaf2f8; }
    .message.assistant { justify-self: start; background: #f5f7f8; }
    .message-role { display: block; margin-bottom: 5px; color: #52606d; font-size: .8rem; font-weight: 700; }
    .message-content { margin: 0; }
    .message .source-disclosure { margin-top: 10px; white-space: normal; }
    #evaluation { margin-top: 12px; padding-top: 12px; border-top: 1px solid #d8e0e8; }
    #evaluation h2 { margin: 0 0 10px; font-size: 1rem; }
    .metric-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .metric { padding: 10px; background: #f3f6f8; border-radius: 6px; }
    .metric-label { display: block; color: #52606d; font-size: .82rem; }
    .metric-value { display: block; margin-top: 4px; font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    #evaluation-error { margin: 8px 0 0; color: #9b2c2c; font-size: .85rem; }
    .success { background: #e8f5ed !important; color: #185c37; }
    .error { background: #fcebea !important; color: #9b2c2c; }
  </style>
</head>
<body>
  <main>
    <h1>Test document upload</h1>
    <p>Create a session, then upload documents or add web references.</p>

    <div class="row">
      <button id="create" type="button">Create session</button>
      <span id="session">No session yet</span>
    </div>

    <div class="row">
      <input id="files" type="file" multiple aria-label="Documents to upload">
      <textarea id="urls" aria-label="Document URLs" placeholder="https://example.com/article&#10;https://example.com/another-article"></textarea>
      <button id="upload" type="button" disabled>Add sources</button>
      <div id="selected-files" aria-live="polite">No files selected.</div>
    </div>

    <div class="row">
      <textarea id="question" aria-label="Question" placeholder="Ask a question about the uploaded documents" disabled></textarea>
      <button id="ask" type="button" disabled>Ask question</button>
    </div>

    <div id="status" role="status">Ready.</div>
    <section id="conversation" aria-live="polite" aria-label="Conversation">
      <p id="empty-conversation">No messages yet.</p>
    </section>
    <section id="evaluation" aria-live="polite" aria-label="Answer evaluation">
      <h2>Turn metrics</h2>
      <div class="metric-list">
        <div class="metric"><span class="metric-label">Answer relevance</span><span class="metric-value" id="answer-relevance">--</span></div>
        <div class="metric"><span class="metric-label">Faithfulness</span><span class="metric-value" id="faithfulness">--</span></div>
        <div class="metric"><span class="metric-label">Overall latency</span><span class="metric-value" id="latency">--</span></div>
      </div>
      <p id="evaluation-status" aria-live="polite"></p>
      <p id="evaluation-error" hidden></p>
    </section>
  </main>

  <script>
    let sessionId = null;
    const createButton = document.querySelector('#create');
    const uploadButton = document.querySelector('#upload');
    const askButton = document.querySelector('#ask');
    const fileInput = document.querySelector('#files');
    const urlsInput = document.querySelector('#urls');
    const questionInput = document.querySelector('#question');
    const sessionLabel = document.querySelector('#session');
    const status = document.querySelector('#status');
    const conversation = document.querySelector('#conversation');
    const answerRelevance = document.querySelector('#answer-relevance');
    const faithfulness = document.querySelector('#faithfulness');
    const latency = document.querySelector('#latency');
    const evaluationStatus = document.querySelector('#evaluation-status');
    const evaluationError = document.querySelector('#evaluation-error');
    const selectedFilesLabel = document.querySelector('#selected-files');
    let selectedFiles = [];
    let evaluationRequestNumber = 0;

    function renderTurn(turn) {
      const article = document.createElement('article');
      article.className = 'turn';

      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      const userRole = document.createElement('span');
      userRole.className = 'message-role';
      userRole.textContent = 'You';
      const question = document.createElement('p');
      question.className = 'message-content';
      question.textContent = turn.question;
      userMessage.append(userRole, question);

      const assistantMessage = document.createElement('div');
      assistantMessage.className = 'message assistant';
      const assistantRole = document.createElement('span');
      assistantRole.className = 'message-role';
      assistantRole.textContent = 'Assistant';
      const answer = document.createElement('p');
      answer.className = 'message-content';
      answer.textContent = turn.answer;
      assistantMessage.append(assistantRole, answer);

      const sources = turn.sources || [];
      if (sources.length) {
        const disclosure = document.createElement('details');
        disclosure.className = 'source-disclosure';
        const summary = document.createElement('summary');
        summary.textContent = `Sources (${sources.length})`;
        const sourceList = document.createElement('ol');
        sourceList.className = 'source-list';
        sources.forEach((source, index) => {
          const item = document.createElement('li');
          const metadata = source.metadata || {};
          const label = metadata.title || metadata.filename || metadata.file_name || metadata.source || metadata.url;
          const heading = document.createElement('h3');
          heading.className = 'source-heading';
          heading.textContent = typeof label === 'string' ? label : `Source ${index + 1}`;
          item.append(heading);
          const excerpt = (source.content || '').replace(/\s+/g, ' ').trim();
          if (excerpt) {
            const preview = document.createElement('p');
            preview.textContent = excerpt.length > 600 ? `${excerpt.slice(0, 600)}...` : excerpt;
            item.append(preview);
          }
          sourceList.append(item);
        });
        disclosure.append(summary, sourceList);
        assistantMessage.append(disclosure);
      }

      article.append(userMessage, assistantMessage);
      conversation.append(article);
    }

    function renderHistory(turns) {
      conversation.replaceChildren();
      if (!turns.length) {
        const empty = document.createElement('p');
        empty.textContent = 'No messages yet.';
        conversation.append(empty);
        return;
      }
      turns.forEach(renderTurn);
    }

    async function restoreSession() {
      const savedSessionId = localStorage.getItem('rag-session-id');
      if (!savedSessionId) return;
      try {
        const historyResponse = await fetch(`/sessions/${savedSessionId}/history`);
        if (!historyResponse.ok) throw new Error(await readError(historyResponse));
        const turns = await historyResponse.json();
        sessionId = savedSessionId;
        sessionLabel.textContent = sessionId;
        renderHistory(turns);

        const documentsResponse = await fetch(`/sessions/${sessionId}/documents`);
        const activeSession = documentsResponse.ok;
        uploadButton.disabled = !activeSession;
        questionInput.disabled = !activeSession;
        if (activeSession) {
          const documents = await documentsResponse.json();
          askButton.disabled = !documents.some(document => document.status === 'completed');
          showStatus('Conversation restored.', 'success');
        } else {
          showStatus('Conversation restored. Create a new session to continue chatting.', 'success');
        }
      } catch {
        localStorage.removeItem('rag-session-id');
        showStatus('Previous conversation could not be restored. Create a session to start chatting.');
      }
    }

    function renderSelectedFiles() {
      selectedFilesLabel.replaceChildren();
      const summary = document.createElement('p');
      summary.textContent = selectedFiles.length
        ? `${selectedFiles.length} file(s) selected:`
        : 'No files selected.';
      selectedFilesLabel.append(summary);

      if (!selectedFiles.length) return;

      const list = document.createElement('ul');
      list.className = 'selected-file-list';
      selectedFiles.forEach((file, index) => {
        const item = document.createElement('li');
        item.className = 'selected-file-item';
        const name = document.createElement('span');
        name.textContent = file.name;
        const removeButton = document.createElement('button');
        removeButton.className = 'remove-file';
        removeButton.type = 'button';
        removeButton.textContent = 'Remove';
        removeButton.setAttribute('aria-label', `Remove ${file.name}`);
        removeButton.addEventListener('click', () => {
          selectedFiles.splice(index, 1);
          renderSelectedFiles();
        });
        item.append(name, removeButton);
        list.append(item);
      });
      selectedFilesLabel.append(list);
    }

    fileInput.addEventListener('change', () => {
      for (const file of fileInput.files) {
        const alreadySelected = selectedFiles.some(selected =>
          selected.name === file.name && selected.size === file.size && selected.lastModified === file.lastModified
        );
        if (!alreadySelected) selectedFiles.push(file);
      }
      fileInput.value = '';
      renderSelectedFiles();
    });

    function showStatus(message, kind = '') {
      status.textContent = message;
      status.className = kind;
    }

    function showEvaluation(evaluation = {}, taskStatus = 'completed') {
      const formatScore = score => Number.isFinite(score)
        ? `${(score * 100).toFixed(1)}%`
        : taskStatus === 'pending' ? 'Pending' : 'Unavailable';
      answerRelevance.textContent = formatScore(evaluation.answer_relevance);
      faithfulness.textContent = formatScore(evaluation.faithfulness);
      latency.textContent = Number.isFinite(evaluation.latency_ms)
        ? `${Math.round(evaluation.latency_ms)} ms`
        : 'Unavailable';
      evaluationStatus.textContent = taskStatus === 'pending' ? 'Evaluation in progress...' : '';
      evaluationError.textContent = evaluation.error || '';
      evaluationError.hidden = !evaluation.error;
    }

    async function pollEvaluation(evaluationId, requestNumber) {
      const url = `/sessions/${sessionId}/evaluations/${evaluationId}`;
      try {
        while (requestNumber === evaluationRequestNumber) {
          await new Promise(resolve => setTimeout(resolve, 750));
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(await readError(response));
          const task = await response.json();
          if (requestNumber !== evaluationRequestNumber) return;
          showEvaluation(task.evaluation || {}, task.status);
          if (task.status !== 'pending') return;
        }
      } catch (error) {
        if (requestNumber !== evaluationRequestNumber) return;
        evaluationStatus.textContent = '';
        evaluationError.textContent = `Evaluation status unavailable: ${error.message}`;
        evaluationError.hidden = false;
      }
    }

    async function readError(response) {
      try {
        const body = await response.json();
        return body.detail || JSON.stringify(body);
      } catch {
        return response.statusText || `HTTP ${response.status}`;
      }
    }

    createButton.addEventListener('click', async () => {
      createButton.disabled = true;
      showStatus('Creating session...');
      try {
        const response = await fetch('/sessions', { method: 'POST' });
        if (!response.ok) throw new Error(await readError(response));
        const session = await response.json();
        evaluationRequestNumber += 1;
        sessionId = session.session_id;
        localStorage.setItem('rag-session-id', sessionId);
        sessionLabel.textContent = sessionId;
        uploadButton.disabled = false;
        questionInput.disabled = false;
        askButton.disabled = true;
        renderHistory([]);
        showStatus('Session created. Choose files or enter URLs, then add your sources.', 'success');
      } catch (error) {
        showStatus(`Session creation failed: ${error.message}`, 'error');
      } finally {
        createButton.disabled = false;
      }
    });

    uploadButton.addEventListener('click', async () => {
      const files = selectedFiles;
      const urls = urlsInput.value.split(/\r?\n/).map(url => url.trim()).filter(Boolean);
      if ((!files.length && !urls.length) || !sessionId) return;
      uploadButton.disabled = true;
      showStatus(`Adding ${files.length + urls.length} source(s)...`);
      const form = new FormData();
      files.forEach(file => form.append('files', file));
      urls.forEach(url => form.append('urls', url));
      try {
        const response = await fetch(`/sessions/${sessionId}/documents`, {
          method: 'POST',
          body: form,
        });
        if (!response.ok) throw new Error(await readError(response));
        const documents = await response.json();
        selectedFiles = [];
        renderSelectedFiles();
        askButton.disabled = false;
        const succeeded = documents.filter(document => document.status === 'completed').length;
        const failed = documents.length - succeeded;
        showStatus(
          `Added ${succeeded} source(s)${failed ? `; ${failed} failed` : ''}.\n${JSON.stringify(documents, null, 2)}`,
          failed ? 'error' : 'success',
        );
      } catch (error) {
        showStatus(`Upload failed: ${error.message}`, 'error');
      } finally {
        uploadButton.disabled = false;
      }
    });

    askButton.addEventListener('click', async () => {
      const question = questionInput.value.trim();
      if (!question || !sessionId) return;
      const requestNumber = ++evaluationRequestNumber;
      askButton.disabled = true;
      showStatus('Generating answer...');
      try {
        const response = await fetch(`/sessions/${sessionId}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        if (!response.ok) throw new Error(await readError(response));
        const result = await response.json();
        renderTurn(result);
        showEvaluation(result.evaluation, 'pending');
        void pollEvaluation(result.evaluation_id, requestNumber);
      } catch (error) {
        showStatus(`Chat failed: ${error.message}`, 'error');
      } finally {
        askButton.disabled = false;
      }
    });

    void restoreSession();
  </script>
</body>
</html>
